<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="LangApp — Learn languages, one day at a time">
  <defs>
    <!-- Background gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#312E81"/>
      <stop offset="100%" stop-color="#4C6FFF"/>
    </linearGradient>

    <!-- Radial glow haut-droite -->
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#8AA5FF" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#8AA5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Radial glow bas-gauche -->
    <radialGradient id="glow2" cx="0.1" cy="0.9" r="0.5">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>

    <!-- Text gradient -->
    <linearGradient id="textGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="60%" stop-color="#E0E7FF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>

    <!-- Icon gradient -->
    <linearGradient id="iconGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#E0E7FF"/>
    </linearGradient>

    <!-- Accent line -->
    <linearGradient id="accentLine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="50%" stop-color="#FFD45C"/>
      <stop offset="100%" stop-color="#12C48B"/>
    </linearGradient>

    <!-- Shadow -->
    <filter id="bannerShadow" x="-5%" y="-5%" width="110%" height="110%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="12"/>
      <feOffset dx="0" dy="8" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.3"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond -->
  <rect width="1280" height="400" fill="url(#bgGrad)"/>

  <!-- Glows -->
  <circle cx="1090" cy="80" r="320" fill="url(#glow1)"/>
  <circle cx="130" cy="360" r="240" fill="url(#glow2)"/>

  <!-- Grille décorative (points) -->
  <g opacity="0.08" fill="#FFFFFF">
    <pattern id="dots" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.5"/>
    </pattern>
    <rect width="1280" height="400" fill="url(#dots)"/>
  </g>

  <!-- Ligne accent en haut -->
  <rect x="0" y="0" width="1280" height="4" fill="url(#accentLine)"/>

  <!-- Icône (bulle + A) -->
  <g transform="translate(90 120)" filter="url(#bannerShadow)">
    <!-- Cercle background -->
    <rect x="0" y="0" width="160" height="160" rx="40" ry="40" fill="#FFFFFF" opacity="0.12"/>

    <!-- Bulle -->
    <path d="M 34 50
             Q 34 30 54 30
             L 106 30
             Q 126 30 126 50
             L 126 96
             Q 126 116 106 116
             L 70 116
             L 50 134
             L 50 116
             Q 34 116 34 96
             Z"
          fill="url(#iconGrad)"/>

    <!-- Lettre A -->
    <g transform="translate(80 82)" fill="#4C6FFF">
      <path d="M -22 -20 L -6 20 L 6 20 L -10 -20 Z"/>
      <path d="M -22 -20 L -6 20 L -12 20 L -28 -20 Z" opacity="0.5"/>
      <path d="M -16 0 L 2 0 L 2 -6 L -19 -6 Z" fill="#FFB020"/>
    </g>
  </g>

  <!-- Titre -->
  <text x="290" y="200"
        font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
        font-size="88"
        font-weight="800"
        fill="url(#textGrad)"
        letter-spacing="-2">
    LangApp
  </text>

  <!-- Sous-titre -->
  <text x="290" y="248"
        font-family="Inter, -apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif"
        font-size="24"
        font-weight="500"
        fill="#C7D2FE"
        letter-spacing="0.5">
    Learn languages, one day at a time.
  </text>

  <!-- Tags / tech stack -->
  <g transform="translate(290 290)" font-family="Inter, sans-serif" font-size="14" font-weight="600">
    <!-- Flutter -->
    <g>
      <rect x="0" y="0" width="120" height="34" rx="17" fill="#FFFFFF" opacity="0.1"/>
      <text x="60" y="22" text-anchor="middle" fill="#E0E7FF">Flutter</text>
    </g>

    <!-- Node.js -->
    <g transform="translate(132 0)">
      <rect x="0" y="0" width="120" height="34" rx="17" fill="#FFFFFF" opacity="0.1"/>
      <text x="60" y="22" text-anchor="middle" fill="#E0E7FF">Node.js</text>
    </g>

    <!-- PostgreSQL -->
    <g transform="translate(264 0)">
      <rect x="0" y="0" width="140" height="34" rx="17" fill="#FFFFFF" opacity="0.1"/>
      <text x="70" y="22" text-anchor="middle" fill="#E0E7FF">PostgreSQL</text>
    </g>

    <!-- Offline-first -->
    <g transform="translate(416 0)">
      <rect x="0" y="0" width="140" height="34" rx="17" fill="#FFFFFF" opacity="0.1"/>
      <text x="70" y="22" text-anchor="middle" fill="#E0E7FF">Offline-first</text>
    </g>

    <!-- SRS -->
    <g transform="translate(568 0)">
      <rect x="0" y="0" width="80" height="34" rx="17" fill="#FFB020" opacity="0.18"/>
      <text x="40" y="22" text-anchor="middle" fill="#FFD45C">SRS</text>
    </g>
  </g>

  <!-- Emojis flottants décoratifs (droite) -->
  <g opacity="0.35">
    <text x="1140" y="200" font-size="60" text-anchor="middle">🌍</text>
    <text x="1050" y="290" font-size="40" text-anchor="middle">📚</text>
    <text x="1180" y="310" font-size="34" text-anchor="middle">🔥</text>
    <text x="1010" y="140" font-size="34" text-anchor="middle">🎯</text>
  </g>

  <!-- Cercles décoratifs -->
  <circle cx="1240" cy="40" r="6" fill="#12C48B" opacity="0.6"/>
  <circle cx="1200" cy="60" r="4" fill="#FFB020" opacity="0.6"/>
  <circle cx="40" cy="80" r="5" fill="#8AA5FF" opacity="0.6"/>
</svg>
