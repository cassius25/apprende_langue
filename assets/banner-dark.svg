<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" width="1280" height="400" role="img" aria-label="LangApp — Learn languages, one day at a time (dark)">
  <defs>
    <linearGradient id="bgGradDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0F1115"/>
      <stop offset="50%" stop-color="#1E1B4B"/>
      <stop offset="100%" stop-color="#312E81"/>
    </linearGradient>

    <radialGradient id="glow1Dark" cx="0.85" cy="0.2" r="0.6">
      <stop offset="0%" stop-color="#4C6FFF" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#4C6FFF" stop-opacity="0"/>
    </radialGradient>

    <radialGradient id="glow2Dark" cx="0.1" cy="0.9" r="0.5">
      <stop offset="0%" stop-color="#FFB020" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#FFB020" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="textGradDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#C7D2FE"/>
    </linearGradient>

    <linearGradient id="accentLineDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFB020"/>
      <stop offset="50%" stop-color="#FFD45C"/>
      <stop offset="100%" stop-color="#12C48B"/>
    </linearGradient>
  </defs>

  <rect width="1280" height="400" fill="url(#bgGradDark)"/>
  <circle cx="1090" cy="80" r="320" fill="url(#glow1Dark)"/>
  <circle cx="130" cy="360" r="240" fill="url(#glow2Dark)"/>

  <rect x="0" y="0" width="1280" height="4" fill="url(#accentLineDark)"/>

  <!-- Icône -->
  <g transform="translate(90 120)">
    <rect x="0" y="0" width="160" height="160" rx="40" ry="40" fill="#FFFFFF" opacity="0.08"/>
    <path d="M 34 50 Q 34 30 54 30 L 106 30 Q 126 30 126 50 L 126 96 Q 126 116 106 116 L 70 116 L 50 134 L 50 116 Q 34 116 34 96 Z"
          fill="#FFFFFF"/>
    <g transform="translate(80 82)" fill="#4C6FFF">
      <path d="M -22 -20 L -6 20 L 6 20 L -10 -20 Z"/>
      <path d="M -16 0 L 2 0 L 2 -6 L -19 -6 Z" fill="#FFB020"/>
    </g>
  </g>

  <text x="290" y="200"
        font-family="Inter, sans-serif" font-size="88" font-weight="800"
        fill="url(#textGradDark)" letter-spacing="-2">LangApp</text>

  <text x="290" y="248"
        font-family="Inter, sans-serif" font-size="24" font-weight="500"
        fill="#8AA5FF">Learn languages, one day at a time.</text>

  <g transform="translate(290 290)" font-family="Inter, sans-serif" font-size="14" font-weight="600">
    <g><rect width="120" height="34" rx="17" fill="#FFFFFF" opacity="0.08"/><text x="60" y="22" text-anchor="middle" fill="#C7D2FE">Flutter</text></g>
    <g transform="translate(132 0)"><rect width="120" height="34" rx="17" fill="#FFFFFF" opacity="0.08"/><text x="60" y="22" text-anchor="middle" fill="#C7D2FE">Node.js</text></g>
    <g transform="translate(264 0)"><rect width="140" height="34" rx="17" fill="#FFFFFF" opacity="0.08"/><text x="70" y="22" text-anchor="middle" fill="#C7D2FE">PostgreSQL</text></g>
    <g transform="translate(416 0)"><rect width="140" height="34" rx="17" fill="#FFFFFF" opacity="0.08"/><text x="70" y="22" text-anchor="middle" fill="#C7D2FE">Offline-first</text></g>
    <g transform="translate(568 0)"><rect width="80" height="34" rx="17" fill="#FFB020" opacity="0.18"/><text x="40" y="22" text-anchor="middle" fill="#FFD45C">SRS</text></g>
  </g>

  <g opacity="0.4">
    <text x="1140" y="200" font-size="60" text-anchor="middle">🌍</text>
    <text x="1050" y="290" font-size="40" text-anchor="middle">📚</text>
    <text x="1180" y="310" font-size="34" text-anchor="middle">🔥</text>
    <text x="1010" y="140" font-size="34" text-anchor="middle">🎯</text>
  </g>
