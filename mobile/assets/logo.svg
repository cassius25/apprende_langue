<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="LangApp logo">
  <defs>
    <!-- Gradient principal -->
    <linearGradient id="primaryGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#4C6FFF"/>
      <stop offset="100%" stop-color="#3B4FCC"/>
    </linearGradient>

    <!-- Gradient accent -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFD45C"/>
      <stop offset="100%" stop-color="#FFB020"/>
    </linearGradient>

    <!-- Gradient glow -->
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8AA5FF" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#8AA5FF" stop-opacity="0"/>
    </radialGradient>

    <!-- Ombre -->
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetBlur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.25"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Fond arrondi -->
  <rect x="24" y="24" width="464" height="464" rx="112" ry="112" fill="url(#primaryGrad)"/>

  <!-- Halo lumineux -->
  <circle cx="256" cy="256" r="200" fill="url(#glow)"/>

  <!-- Bulle de dialogue (fond) -->
  <g filter="url(#softShadow)">
    <path d="M 136 196
             Q 136 148 184 148
             L 328 148
             Q 376 148 376 196
             L 376 296
             Q 376 344 328 344
             L 232 344
             L 184 388
             L 184 344
             L 184 344
             Q 136 344 136 296
             Z"
          fill="#FFFFFF"
          opacity="0.96"/>

    <!-- Petit accent décoratif -->
    <circle cx="176" cy="216" r="8" fill="url(#accentGrad)"/>
    <circle cx="200" cy="216" r="8" fill="#E5E7EB"/>
    <circle cx="224" cy="216" r="8" fill="#E5E7EB"/>
  </g>

  <!-- Lettre "A" stylisée (Langage / Apprentissage) -->
  <g transform="translate(256 268)">
    <!-- A gauche -->
    <path d="M -70 -50 L -18 50 L 18 50 L -34 -50 Z" fill="#4C6FFF"/>
    <!-- A droite -->
    <path d="M -70 -50 L -18 50 L -34 50 L -86 -50 Z" fill="#3B4FCC" opacity="0.4"/>
    <!-- Barre transversale -->
    <path d="M -50 0 L 0 0 L 0 -18 L -60 -18 Z" fill="#FFB020"/>
    <!-- Points (décoratifs) -->
    <circle cx="-95" cy="-58" r="8" fill="#FFD45C"/>
    <circle cx="95" cy="-58" r="8" fill="#12C48B"/>
  </g>

  <!-- Gloss subtil -->
  <path d="M 24 136 Q 256 60 488 136 L 488 136 L 488 24 L 24 24 Z"
        fill="#FFFFFF"
        opacity="0.08"/>
</svg>
