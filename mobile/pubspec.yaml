name: langapp
description: Application mobile d'apprentissage des langues.
publish_to: 'none'
version: 1.0.0+1

environment:
    sdk: 3.12.2

dependencies:
    flutter:
        sdk: flutter
    flutter_localizations:
        sdk: flutter

    # ─── State management ──────────────────────────────
    flutter_riverpod: ^2.6.1
    riverpod_annotation: ^2.6.1

    # ─── Routing ───────────────────────────────────────
    go_router: ^14.6.0

    # ─── Network ───────────────────────────────────────
    dio: ^5.7.0
    connectivity_plus: ^6.1.0

    # ─── Local storage ─────────────────────────────────
    shared_preferences: ^2.3.3
    flutter_secure_storage: ^9.2.2

    # ─── Models / serialization ────────────────────────
    freezed_annotation: ^2.4.4
    json_annotation: ^4.9.0
    uuid: ^4.5.1
    collection: ^1.18.0

    # ─── UI ────────────────────────────────────────────
    google_fonts: ^6.2.1
    flutter_svg: ^2.0.14
    cached_network_image: ^3.4.1
    shimmer: ^3.0.0
    lottie: ^3.1.3

    # ─── Audio ─────────────────────────────────────────
    just_audio: ^0.9.42
    record: ^5.1.2

    # ─── Utils ─────────────────────────────────────────
    intl: ^0.20.2
    logger: ^2.5.0
    equatable: ^2.0.7
    dartz: ^0.10.1

    # ─── Notifications (préparation Partie 18) ─────────
    flutter_local_notifications: ^18.0.1

    cupertino_icons: ^1.0.8

dev_dependencies:
    flutter_test:
        sdk: flutter
    integration_test:
        sdk: flutter

    # ─── Codegen ───────────────────────────────────────
    build_runner: ^2.4.13
    freezed: ^2.5.7
    json_serializable: ^6.9.0
    riverpod_generator: ^2.6.3
    custom_lint: ^0.7.0
    riverpod_lint: ^2.6.3

    # ─── Lints ─────────────────────────────────────────
    flutter_lints: ^5.0.0

    # ─── Tests ─────────────────────────────────────────
    mocktail: ^1.0.4

flutter:
    uses-material-design: true
    generate: true

    assets:
        - assets/images/
        - assets/audio/
        - assets/animations/

    # fonts:
